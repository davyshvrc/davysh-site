name: Drops

# Rebuilds the drops log (drops.json, /drops/, the home "Latest drops" block,
# /drops/feed.xml, product thumbnails) once a day from the public storefront at
# davysh.gumroad.com. No Gumroad login, key or repository secret is used.
# Commits only when something changed, then asks GitHub Pages to rebuild
# (pushes made with GITHUB_TOKEN do not trigger a Pages build on their own).

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drops
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit the regenerated files
      pages: write      # request a Pages build after the commit (built-in GitHub token)
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Pillow (thumbnail resize to WebP)
        run: python -m pip install --disable-pip-version-check --no-input "Pillow==13.0.0"

      - name: Build drops (public storefront data only)
        run: python scripts/build_drops.py

      - name: Commit if changed
        id: commit
        run: |
          git add -A drops.json drops/ index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "drops: update from the Gumroad storefront"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
